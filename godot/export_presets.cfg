; Export presets. The game reads its exported data (.json, .bin) with FileAccess, so those files
; are included explicitly. Install the export templates in the editor (Editor > Manage Export
; Templates) before exporting.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json, *.bin"
exclude_filter="tests/*"
export_path="build/windows/wallr.exe"

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

